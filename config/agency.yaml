# ─── Routing Rules ─────────────────────────────────────────────
routing_rules:
  - pattern: 'publish portfolio|portfolio entry|add .* to (the )?portfolio'
    target: portfolio_publisher
  - pattern: 'github\.com/sahiixx/sahiixx|sahiixx profile|profile README|flagship projects.*registry|missing from the agency registry'
    target: web_intel
  - pattern: "trending repo|trending github|trending project|discover.*(repo|project|github)|find.*trending|scout.*(repo|github)|hidden gem|new github project|intel scout|what.*trending.*(repo|github)"
    target: discovery
  - pattern: "qualify.*(lead|enquiry|prospect)|score.*lead|capture.*lead|lead.*intake|new lead|route.*lead|match.*(lead|property)|schedule.*(viewing|lead|call)"
    target: lead_machine
  - pattern: "trufflehog|secret scan|leaked credential|find secrets|scan for secrets|scan.*leak"
    target: trufflehog

  - pattern: "shannon|ai pentest|autonomous pentest|self-driving pentest|autonomously find vulnerability"
    target: shannon
  - pattern: "t3mp3st|red.team|offensive|0-day|zero.day|exploit|pentest|recon|scan|vuln|vulnerability|security|cve|hunt|threat|attack|ctf|pwn|bug.bounty|osint"
    target: T3MP3ST
  - pattern: "voice|speak|listen|call"
    target: friday
  - pattern: "letta|persistent.memory|stateful.agent|local.agent|long[- ]term memory|spin up.*agent.*memory|agent.*long[- ]term memory|stateful agent|memory agent"
    target: letta_code
  - pattern: "resume|candidate|hire|hiring|evaluate.profile|screen|recruit"
    target: hiring_agent
  - pattern: "job|career|apply|linkedin|cv|resume"
    target: career_ops
  - pattern: "html|landing.page|landingpage|deck|magazine|report|social.post|generate.page|html-anything|nexu-io|open design"
    target: html_anything
  - pattern: "montage|video production|remotion|openmontage|produce a video|make a video|cinematic|video montage"
    target: openmontage
