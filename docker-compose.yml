version: "3.8"

services:
  agency-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opa-agency-api
    ports:
      - "8080:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-sahiixx}
      - OPA_CONFIG=/app/config/agency.yaml
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    command: uvicorn sahiixx_agency.api.main:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  agency-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opa-agency-mcp
    ports:
      - "8081:8081"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-sahiixx}
      - OPA_CONFIG=/app/config/agency.yaml
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8081
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    command: python -m sahiixx_agency.mcp_server.main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
