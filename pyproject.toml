[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sahiixx-agency"
version = "1.0.0"
description = "One Person Agency — Unified AI orchestration for all repos"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sahiix", email = "sahiix@aios" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.5",
    "watchdog>=6.0.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "psutil>=6.1.0",
    "schedule>=1.2.2",
    "mcp>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.2",
    "pre-commit>=4.1.0",
]

[project.scripts]
opa = "sahiixx_agency.cli.main:app"
sahiixx-agency = "sahiixx_agency.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["sahiixx_agency"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
