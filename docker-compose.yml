version: "3.8"

services:
  agency-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-sahiixx}
      - OPA_CONFIG=/app/config/agency.yaml
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: uvicorn sahiixx_agency.api.main:app --host 0.0.0.0 --port 8080 --reload

  agency-mcp:
    build: .
    ports:
      - "8081:8081"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-sahiixx}
    volumes:
      - ./data:/app/data
    command: python -m sahiixx_agency.mcp_server.main

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://agency-api:8080
    depends_on:
      - agency-api
